#cloud-config

# Deterministic private-network interface naming on Exoscale.
#
# Ubuntu 24.04 / Netplan
#
# MANAGED private networks, offline:
# - no Exoscale API
# - no API key
# - no metadata service
# - no internet required
# - works with --public-ip none
#
# Each managed private network provides a DHCP lease.
# The subnet of that lease is used to identify the network.
#
# The script then creates a persistent Netplan configuration:
#
#   subnet -> MAC address -> desired interface name
#
# Example:
#
#   10.1.1.0/24 -> MAC xx:xx:xx:xx:xx:01 -> vnf_mgmt
#   10.1.3.0/24 -> MAC xx:xx:xx:xx:xx:02 -> sig_int
#   10.1.5.0/24 -> MAC xx:xx:xx:xx:xx:03 -> oam_ne
#
# Fill in each network's subnet and desired interface name.

write_files:

  - path: /etc/privnet-namer/config.json
    permissions: '0600'
    content: |
      {
        "networks": [
          { "subnet": "10.1.1.0/24", "name": "vnf_mgmt" },
          { "subnet": "10.1.3.0/24", "name": "sig_int" },
          { "subnet": "10.1.5.0/24", "name": "oam_ne" }
        ]
      }

  - path: /usr/local/bin/privnet-namer.py
    permissions: '0755'
    content: |
      #!/usr/bin/env python3

      """
      privnet-namer
      Ubuntu 24.04 / Netplan / managed Exoscale private networks.

      Managed private networks provide DHCP leases from their respective
      subnets. The DHCP address is therefore sufficient to identify the
      private network without using the Exoscale API, metadata or Internet.

      The script:

        1. waits for DHCP leases on all configured private networks
        2. identifies the interface belonging to each subnet
        3. obtains its MAC address
        4. creates a persistent Netplan configuration
        5. assigns the requested interface name
        6. enables DHCP on the interface

      Configuration:
        /etc/privnet-namer/config.json

      Generated Netplan:
        /etc/netplan/99-privnet-namer.yaml
      """

      import ipaddress
      import json
      import os
      import subprocess
      import sys
      import time


      CONFIG = os.environ.get(
          "PRIVNET_NAMER_CONFIG",
          "/etc/privnet-namer/config.json"
      )

      NETPLAN_FILE = "/etc/netplan/99-privnet-namer.yaml"


      def log(msg):
          print("[privnet-namer] " + msg, flush=True)


      def run(cmd, check=False):
          log("+ " + " ".join(cmd))

          p = subprocess.run(
              cmd,
              stdout=subprocess.PIPE,
              stderr=subprocess.STDOUT,
              universal_newlines=True
          )

          output = (p.stdout or "").strip()

          if output:
              log("  " + output)

          if check and p.returncode != 0:
              raise RuntimeError(
                  "command failed with rc=%d: %s"
                  % (p.returncode, output)
              )

          return p


      def iface_ipv4(ifname):
          """
          Return all IPv4 addresses assigned to an interface.
          """

          p = subprocess.run(
              [
                  "ip",
                  "-o",
                  "-4",
                  "addr",
                  "show",
                  "dev",
                  ifname
              ],
              stdout=subprocess.PIPE,
              stderr=subprocess.DEVNULL,
              universal_newlines=True
          )

          addresses = []

          for line in (p.stdout or "").splitlines():

              parts = line.split()

              if len(parts) >= 4 and parts[2] == "inet":
                  addresses.append(
                      parts[3].split("/")[0]
                  )

          return addresses


      def scan():
          """
          Return information about all non-loopback interfaces.

          Result:

            {
              "ens3": {
                "mac": "aa:bb:cc:dd:ee:ff",
                "ips": ["10.1.1.23"]
              }
            }
          """

          result = {}

          for ifname in os.listdir("/sys/class/net"):

              if ifname == "lo":
                  continue

              try:
                  with open(
                      "/sys/class/net/%s/address" % ifname
                  ) as f:
                      mac = f.read().strip().lower()

              except OSError:
                  continue

              result[ifname] = {
                  "mac": mac,
                  "ips": iface_ipv4(ifname)
              }

          return result


      def match_networks(networks):
          """
          Match every configured subnet against the DHCP address
          currently assigned to an interface.
          """

          configured = [
              (
                  ipaddress.ip_network(n["subnet"]),
                  n
              )
              for n in networks
          ]

          # Wait up to 2 minutes for DHCP.
          for attempt in range(1, 41):

              found = {}

              for ifname, info in scan().items():

                  for ip in info["ips"]:

                      addr = ipaddress.ip_address(ip)

                      for net, network in configured:

                          if addr in net:

                              name = network["name"]

                              if name in found:
                                  raise RuntimeError(
                                      "multiple interfaces match "
                                      "subnet %s"
                                      % network["subnet"]
                                  )

                              found[name] = (
                                  ifname,
                                  info["mac"],
                                  network,
                                  ip
                              )

              if len(found) == len(networks):
                  return found

              log(
                  "waiting for DHCP on all subnets "
                  "(%d/%d), attempt %d/40"
                  % (
                      len(found),
                      len(networks),
                      attempt
                  )
              )

              time.sleep(3)

          raise RuntimeError(
              "timed out: not every configured subnet "
              "received a DHCP lease"
          )


      def generate_netplan(found):
          """
          Generate persistent Netplan configuration.

          Interfaces are matched by MAC address and renamed
          using Netplan's set-name.
          """

          lines = []

          lines.append("network:")
          lines.append("  version: 2")
          lines.append("  renderer: networkd")
          lines.append("  ethernets:")

          # Deterministic ordering.
          for name in sorted(found.keys()):

              ifname, mac, network, ip = found[name]

              lines.append(
                  "    %s:" % name
              )

              lines.append("      match:")

              # Quote MAC addresses explicitly.
              lines.append(
                  "        macaddress: '%s'"
                  % mac
              )

              lines.append(
                  "      set-name: '%s'"
                  % name
              )

              lines.append(
                  "      dhcp4: true"
              )

              lines.append(
                  "      dhcp6: false"
              )

              lines.append(
                  "      optional: true"
              )

              if network.get("mtu"):
                  lines.append(
                      "      mtu: %s"
                      % int(network["mtu"])
                  )

          lines.append("")

          with open(NETPLAN_FILE, "w") as f:
              f.write(
                  "\n".join(lines)
              )

          os.chmod(
              NETPLAN_FILE,
              0o600
          )

          log(
              "generated %s"
              % NETPLAN_FILE
          )

          with open(NETPLAN_FILE) as f:
              for line in f:
                  log(
                      "  " + line.rstrip()
                  )


      def validate_netplan():
          """
          Validate the generated Netplan configuration.
          """

          p = run(
              [
                  "netplan",
                  "generate"
              ]
          )

          if p.returncode != 0:
              raise RuntimeError(
                  "netplan generate failed"
              )


      def apply_netplan():
          """
          Apply the generated Netplan configuration.
          """

          run(
              [
                  "netplan",
                  "apply"
              ],
              check=True
          )


      def main():

          log(
              "loading configuration: %s"
              % CONFIG
          )

          with open(CONFIG) as f:
              config = json.load(f)

          networks = config.get(
              "networks",
              []
          )

          if not networks:
              raise RuntimeError(
                  "no networks configured"
              )

          log(
              "expecting %d managed private network(s)"
              % len(networks)
          )

          found = match_networks(
              networks
          )

          for name in sorted(found.keys()):

              ifname, mac, network, ip = found[name]

              log(
                  "matched subnet %s -> "
                  "interface %s -> "
                  "MAC %s -> DHCP %s"
                  % (
                      network["subnet"],
                      name,
                      mac,
                      ip
                  )
              )

          generate_netplan(
              found
          )

          validate_netplan()

          apply_netplan()

          log("done")


      if __name__ == "__main__":

          try:
              main()

          except Exception as e:

              log(
                  "ERROR: %s"
                  % e
              )

              sys.exit(1)


runcmd:
  - [ /usr/bin/python3, /usr/local/bin/privnet-namer.py ]
