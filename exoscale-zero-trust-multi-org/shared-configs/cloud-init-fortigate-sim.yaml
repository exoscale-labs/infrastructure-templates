#cloud-config
# FortiGate simulation for testing

package_update: true
package_upgrade: true

packages:
  - wireguard
  - wireguard-tools
  - iptables-persistent
  - ufw
  - net-tools
  - curl
  - wget

# Enable IP forwarding
write_files:
  - content: |
      net.ipv4.ip_forward=1
      net.ipv6.conf.all.forwarding=1
    path: /etc/sysctl.d/99-fortigate-sim.conf
    owner: root:root
    permissions: '0644'

  - content: |
      [Interface]
      Address = 192.168.100.1/30
      PrivateKey = PRIVATE_KEY_PLACEHOLDER
      ListenPort = 51820
      PostUp = iptables -A FORWARD -i %i -j ACCEPT; iptables -A FORWARD -o %i -j ACCEPT; iptables -t nat -A POSTROUTING -o eth0 -j MASQUERADE
      PostDown = iptables -D FORWARD -i %i -j ACCEPT; iptables -D FORWARD -o %i -j ACCEPT; iptables -t nat -D POSTROUTING -o eth0 -j MASQUERADE

      # Router peers will be added manually
    path: /etc/wireguard/wg0.conf.template
    owner: root:root
    permissions: '0600'

  # Shared SSH key for inter-instance communication
  - content: ${shared_ssh_private_key}
    path: /root/.ssh/shared_key
    owner: root:root
    permissions: '0600'

  - content: |
      #!/bin/bash
      set -x
      exec >> /var/log/fortigate-sim-setup.log 2>&1
      
      # FortiGate simulation setup
      echo "Starting FortiGate simulation setup at $(date)"
      
      # Generate Wireguard keys
      umask 077
      wg genkey | tee /etc/wireguard/private.key | wg pubkey > /etc/wireguard/public.key
      chmod 600 /etc/wireguard/private.key
      chmod 644 /etc/wireguard/public.key
      
      PRIVATE_KEY=$(cat /etc/wireguard/private.key)
      PUBLIC_KEY=$(cat /etc/wireguard/public.key)
      
      # Create Wireguard config from template
      sed "s|PRIVATE_KEY_PLACEHOLDER|$PRIVATE_KEY|g" /etc/wireguard/wg0.conf.template > /etc/wireguard/wg0.conf
      chmod 600 /etc/wireguard/wg0.conf
      
      # Configure NAT for internet access
      iptables -t nat -A POSTROUTING -o eth0 -j MASQUERADE
      iptables -A FORWARD -i wg0 -o eth0 -j ACCEPT
      iptables -A FORWARD -i eth0 -o wg0 -m state --state RELATED,ESTABLISHED -j ACCEPT
      
      # Save iptables rules
      iptables-save > /etc/iptables/rules.v4
      
      # Configure firewall
      ufw --force reset
      ufw allow ssh
      ufw allow 51820/udp
      ufw --force enable
      
      # Apply sysctl settings
      sysctl -p /etc/sysctl.d/99-fortigate-sim.conf
      
      # Start Wireguard
      systemctl enable wg-quick@wg0
      systemctl start wg-quick@wg0
      
      echo "FortiGate simulation setup completed at $(date)"
      echo "Public Key: $PUBLIC_KEY"
      echo "Wireguard interface status:"
      wg show
    path: /opt/fortigate-sim-setup.sh
    owner: root:root
    permissions: '0755'

# Run setup commands
runcmd:
  - /opt/fortigate-sim-setup.sh

# Set timezone
timezone: Europe/Zurich

# Add user for management
users:
  - name: ubuntu
    sudo: ALL=(ALL) NOPASSWD:ALL
    shell: /bin/bash
    ssh_authorized_keys:
      - ${ssh_public_key}
      - ${shared_ssh_public_key}

# Final message
final_message: |
  FortiGate simulation setup completed!
  
  This simulates a FortiGate firewall for testing.
  
  Configuration:
  - Wireguard Interface: 192.168.100.1/30
  - Listens on port 51820
  - Provides NAT for internet access
  
  Get public key: sudo cat /etc/wireguard/public.key